<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Mobile-first commercial-ready modular game skeleton for a HexGL-derived racing project.">
    <title>Mobile Racing Skeleton</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #071018;
        --panel: rgba(12, 24, 36, 0.86);
        --text: #eaf6ff;
        --muted: #8fb2c8;
        --accent: #32d3ff;
        --danger: #ff6b7a;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { overscroll-behavior: none; touch-action: manipulation; }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #12344a 0, var(--bg) 48%, #020409 100%);
        color: var(--text);
        min-height: 100vh;
      }
      #app {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }
      #app.is-orientation-blocked { filter: blur(2px); pointer-events: none; }
      .app-shell {
        width: min(1120px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 18px 0;
      }
      .topbar, .panel {
        background: var(--panel);
        border: 1px solid rgba(120, 190, 220, 0.22);
        border-radius: 18px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(16px);
      }
      .topbar {
        padding: 14px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
      }
      .brand { font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .risk-badge {
        color: #ffe4ea;
        border: 1px solid rgba(255, 107, 122, 0.5);
        background: rgba(255, 107, 122, 0.12);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 13px;
      }
      .panel { padding: 16px; }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 16px;
        margin-top: 12px;
      }
      canvas {
        width: 100%;
        aspect-ratio: 16 / 9;
        display: block;
        border-radius: 16px;
        background: #02070c;
        border: 1px solid rgba(120, 190, 220, 0.2);
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 10px 14px;
        min-height: 44px;
        font-weight: 700;
        color: #02121a;
        background: var(--accent);
        cursor: pointer;
      }
      button.secondary {
        color: var(--text);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
      }
      .stack { display: grid; gap: 12px; }
      .muted { color: var(--muted); }
      .metric {
        display: grid;
        gap: 4px;
        padding: 12px;
        border-radius: 14px;
        background: rgba(255,255,255,0.055);
        border: 1px solid rgba(255,255,255,0.08);
      }
      .metric strong { font-size: 24px; }
      .hud-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .footer { color: var(--muted); font-size: 13px; padding-bottom: 18px; }
      .orientation-gate {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(2, 4, 9, 0.86);
      }
      .orientation-gate.is-hidden { display: none; }
      .orientation-card {
        width: min(360px, 100%);
        text-align: center;
        padding: 24px;
        border-radius: 22px;
        background: var(--panel);
        border: 1px solid rgba(120, 190, 220, 0.28);
      }
      .phone-icon { font-size: 52px; color: var(--accent); }
      .mobile-controls {
        position: fixed;
        inset: auto max(18px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
        z-index: 40;
        display: none;
        justify-content: space-between;
        pointer-events: none;
      }
      .control-cluster { display: flex; gap: 10px; pointer-events: auto; }
      .mobile-control {
        width: 64px;
        height: 64px;
        border-radius: 999px;
        color: var(--text);
        background: rgba(50, 211, 255, 0.18);
        border: 1px solid rgba(50, 211, 255, 0.42);
        box-shadow: 0 10px 32px rgba(0, 0, 0, 0.32);
      }
      .mobile-control.is-active { background: var(--accent); color: #02121a; }
      @media (max-width: 840px) {
        .layout { grid-template-columns: 1fr; }
        .topbar { align-items: flex-start; flex-direction: column; }
      }
      @media (orientation: landscape) and (pointer: coarse) {
        .shell-header, .footer { display: none; }
        .app-shell { width: calc(100vw - 20px); padding: 10px 0; }
        .layout { grid-template-columns: minmax(0, 1fr); margin-top: 0; }
        #hud-panel.mobile-hud {
          position: fixed;
          z-index: 30;
          top: max(8px, env(safe-area-inset-top));
          left: max(10px, env(safe-area-inset-left));
          right: max(10px, env(safe-area-inset-right));
          padding: 8px;
          background: rgba(2, 7, 12, 0.42);
        }
        .mobile-hud .hud-row { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .mobile-hud .metric { padding: 7px 9px; }
        .mobile-hud .metric strong { font-size: 18px; }
        .mobile-help { display: none; }
        .mobile-controls { display: flex; }
        canvas { max-height: calc(100vh - 20px); }
      }
    </style>
  </head>
  <body>
    <div id="app" aria-live="polite"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
