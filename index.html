<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Commercial-ready modular game skeleton for a HexGL-derived racing project.">
    <title>Commercial Racing Skeleton</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #071018;
        --panel: rgba(12, 24, 36, 0.86);
        --text: #eaf6ff;
        --muted: #8fb2c8;
        --accent: #32d3ff;
        --danger: #ff6b7a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #12344a 0, var(--bg) 48%, #020409 100%);
        color: var(--text);
        min-height: 100vh;
      }
      #app {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }
      .app-shell {
        width: min(1120px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 24px 0;
      }
      .topbar, .panel {
        background: var(--panel);
        border: 1px solid rgba(120, 190, 220, 0.22);
        border-radius: 18px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(16px);
      }
      .topbar {
        padding: 16px 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }
      .brand { font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .risk-badge {
        color: #ffe4ea;
        border: 1px solid rgba(255, 107, 122, 0.5);
        background: rgba(255, 107, 122, 0.12);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 13px;
      }
      .panel { padding: 18px; }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 18px;
        margin-top: 18px;
      }
      canvas {
        width: 100%;
        aspect-ratio: 16 / 9;
        display: block;
        border-radius: 16px;
        background: #02070c;
        border: 1px solid rgba(120, 190, 220, 0.2);
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 10px 14px;
        font-weight: 700;
        color: #02121a;
        background: var(--accent);
        cursor: pointer;
      }
      button.secondary {
        color: var(--text);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
      }
      .stack { display: grid; gap: 12px; }
      .muted { color: var(--muted); }
      .metric {
        display: grid;
        gap: 4px;
        padding: 12px;
        border-radius: 14px;
        background: rgba(255,255,255,0.055);
        border: 1px solid rgba(255,255,255,0.08);
      }
      .metric strong { font-size: 24px; }
      .footer {
        color: var(--muted);
        font-size: 13px;
        padding-bottom: 24px;
      }
      @media (max-width: 840px) {
        .layout { grid-template-columns: 1fr; }
        .topbar { align-items: flex-start; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <div id="app" aria-live="polite"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
